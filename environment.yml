# =============================================================================
# One-command conda environment for the FINN pipeline (Python route).
# Creates an environment named `finn` with a matching PROJ/GEOS stack, so the
# EPSG:4674 / "no database context" errors do not occur.
#
# Create it once (from the project root):
#     conda env create -f environment.yml
#     conda activate finn
#
# Update it later if this file changes:
#     conda env update -f environment.yml --prune
#
# In VS Code, pick the `finn` interpreter/kernel (Ctrl+Shift+P ->
# "Python: Select Interpreter" -> finn) so the same PROJ database is used.
# The R route is separate: see install_r_packages.R.
# =============================================================================
name: finn
channels:
  - conda-forge
dependencies:
  - python=3.11
  - geopandas>=0.12      # spatial join + shapefile I/O (pulls in shapely, pyproj, fiona, GDAL/PROJ)
  - pyproj>=3.4
  - shapely>=2.0
  - pandas>=1.5
  - numpy>=1.23
  - requests>=2.28       # FINN file download
  - matplotlib>=3.6      # descriptive plots
  - pyyaml>=6.0          # read config/config.yml
  - jupyter>=1.0         # run notebooks/FINN_SC_Python.ipynb
  - ipykernel            # register the env as a Jupyter/VS Code kernel
  # ---- analysis layer ----
  - scipy>=1.10          # statistics, KD-tree
  - libpysal>=4.10       # spatial weights
  - spreg>=1.4           # spatial error model
  - esda>=2.5            # Moran's I
  - pytest>=7.0          # tests/
  - mapclassify>=2.5     # Fisher-Jenks classes of Figure 6
  - rasterio>=1.3        # study-area figure (tools/study_area_map.py, extract_mapbiomas_sc.py)
  - pip:
    - pymannkendall>=1.4  # Hamed-Rao modified Mann-Kendall test (a02)
